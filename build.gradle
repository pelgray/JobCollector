import java.util.jar.Attributes.Name

plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group 'com.pelgray'
version '1.0.0'

sourceCompatibility = 17

compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

String SPRING_VER = '6.2.15'
String SLF4J_VER = '2.0.11'
String TELEGRAMBOTS_VER = '9.2.0'

dependencies {
    implementation "org.springframework:spring-core:$SPRING_VER"
    implementation "org.springframework:spring-beans:$SPRING_VER"
    implementation "org.springframework:spring-context:$SPRING_VER"
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'

    // API
    implementation platform('com.konghq:unirest-java-bom:4.7.0')
    implementation 'com.konghq:unirest-java-core'
    implementation 'com.konghq:unirest-modules-gson'
    implementation "org.telegram:telegrambots-longpolling:$TELEGRAMBOTS_VER"
    implementation "org.telegram:telegrambots-client:$TELEGRAMBOTS_VER"
    implementation 'com.google.apis:google-api-services-sheets:v4-rev20251110-2.0.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.39.0'

    // Logger
    implementation "org.slf4j:slf4j-simple:$SLF4J_VER"
    implementation "org.slf4j:slf4j-api:$SLF4J_VER"

    // Test
    testImplementation 'org.testng:testng:7.11.0'
    testImplementation 'org.mockito:mockito-core:5.21.0'
}

test {
    useTestNG() {
        useDefaultListeners = true
    }
    reports.html.required = false
}

jar {
    manifest {
        attributes(
                (Name.SPECIFICATION_TITLE.toString()): project.name,
                (Name.SPECIFICATION_VERSION.toString()): project.version,
                (Name.MAIN_CLASS.toString()): 'com.pelgray.ServiceRunner',
                'Description': 'A service that can send a link from hh.ru via Telegram to Google Sheets.',
                'Built-Date': new Date()
        )
    }
}

shadowJar {
    exclude 'config.properties'
    archiveClassifier.set('')
    minimize {
        exclude(dependency("org.springframework:spring-beans:${SPRING_VER}"))
        exclude(dependency("com.fasterxml.jackson.core:jackson-databind:.*"))
    }
}
